<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DanielAI - Konsultan Jomblo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0e27;
            background-image:
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(168, 85, 247, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(147, 51, 234, 0.15) 0px, transparent 50%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .logo:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.5);
        }

        .header-title h1 {
            color: white;
            font-size: 1.5em;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header-title p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85em;
            margin-top: 2px;
        }

        .header-right {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Profile Menu Styles */
        .profile-menu {
            position: absolute;
            top: 70px;
            left: 40px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 12px;
            min-width: 280px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 1000;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .profile-menu.active {
            display: block;
        }

        .profile-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 10px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 12px;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .profile-name {
            color: white;
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .profile-status {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85em;
        }

        .menu-item {
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95em;
        }

        .menu-item:hover {
            background: rgba(99, 102, 241, 0.1);
            color: white;
        }

        .menu-item span {
            font-size: 1.2em;
        }

        .menu-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
            margin: 8px 0;
        }

        .stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 12px 16px;
            background: rgba(99, 102, 241, 0.05);
            border-radius: 8px;
            margin: 10px 0;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            color: white;
            font-size: 1.5em;
            font-weight: 700;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75em;
            margin-top: 2px;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 65%;
            padding: 16px 20px;
            border-radius: 16px;
            word-wrap: break-word;
            font-size: 0.95em;
            line-height: 1.6;
            position: relative;
        }

        .message.bot .message-content {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.95);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }

        .timestamp {
            font-size: 0.75em;
            opacity: 0.5;
            margin-top: 6px;
            display: block;
        }

        .input-section {
            padding: 30px 40px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .suggestions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .suggestion-chip {
            padding: 8px 16px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s;
        }

        .suggestion-chip:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #userInput {
            flex: 1;
            padding: 16px 24px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 1em;
            color: white;
            outline: none;
            transition: all 0.3s;
        }

        #userInput::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        #userInput:focus {
            border-color: rgba(99, 102, 241, 0.5);
            background: rgba(30, 41, 59, 0.7);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        #sendBtn {
            padding: 16px 32px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }

        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.5);
        }

        #sendBtn:active {
            transform: translateY(0);
        }

        .clear-btn {
            padding: 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            color: rgba(239, 68, 68, 0.8);
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1em;
        }

        .clear-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
        }

        .typing-indicator {
            display: none;
            padding: 16px 20px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            max-width: fit-content;
        }

        .typing-indicator span {
            height: 10px;
            width: 10px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-12px);
                opacity: 1;
            }
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            color: white;
            font-size: 1.5em;
            font-weight: 700;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            transition: all 0.3s;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .modal-body {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.8;
        }

        .history-item {
            padding: 15px;
            background: rgba(99, 102, 241, 0.05);
            border: 1px solid rgba(99, 102, 241, 0.1);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .history-item:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .history-date {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85em;
            margin-bottom: 5px;
        }

        .history-preview {
            color: white;
            font-size: 0.95em;
        }

        .chat-container::-webkit-scrollbar,
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track,
        .modal-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb,
        .modal-content::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.3);
            border-radius: 4px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover,
        .modal-content::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.5);
        }

        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
            }

            .header-right {
                display: none;
            }

            .chat-container {
                padding: 20px;
            }

            .input-section {
                padding: 20px;
            }

            .message-content {
                max-width: 85%;
            }

            .profile-menu {
                left: 20px;
                min-width: 260px;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="header-left">
            <div class="logo" onclick="toggleProfileMenu()">💬</div>
            <div class="header-title">
                <h1>DanielAI</h1>
                <p>Konsultan Pribadi untuk Para Jomblo</p>
            </div>
        </div>
        <div class="header-right">
            <button class="header-btn" onclick="clearChat()">🗑️ Clear</button>
            <button class="header-btn" onclick="toggleTheme()">🌙 Theme</button>
        </div>
    </div>

    <!-- Profile Menu -->
    <div class="profile-menu" id="profileMenu">
        <div class="profile-header">
            <div class="profile-avatar">👤</div>
            <div class="profile-name" id="profileName">Pengguna</div>
            <div class="profile-status">Online</div>
        </div>

        <div class="stats-container">
            <div class="stat-item">
                <div class="stat-value" id="totalChats">0</div>
                <div class="stat-label">Total Chat</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="totalDays">0</div>
                <div class="stat-label">Hari Aktif</div>
            </div>
        </div>

        <div class="menu-item" onclick="showEditProfile()">
            <span>✏️</span>
            <div>Edit Profil</div>
        </div>

        <div class="menu-item" onclick="showHistory()">
            <span>📝</span>
            <div>Riwayat Chat</div>
        </div>

        <div class="menu-item" onclick="showSettings()">
            <span>⚙️</span>
            <div>Pengaturan</div>
        </div>

        <div class="menu-item" onclick="exportChat()">
            <span>💾</span>
            <div>Export Chat</div>
        </div>

        <div class="menu-divider"></div>

        <div class="menu-item" onclick="showAbout()">
            <span>ℹ️</span>
            <div>Tentang DanielAI</div>
        </div>

        <div class="menu-item" onclick="showHelp()">
            <span>❓</span>
            <div>Bantuan</div>
        </div>

        <div class="menu-divider"></div>

        <div class="menu-item" onclick="clearAllData()" style="color: rgba(239, 68, 68, 0.8);">
            <span>⚠️</span>
            <div>Reset Data</div>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="typing-indicator" id="typingIndicator">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>

    <div class="input-section">
        <div class="suggestions">
            <div class="suggestion-chip" onclick="quickReply('Cara PDKT yang baik?')">💘 Cara PDKT</div>
            <div class="suggestion-chip" onclick="quickReply('Tips chatting yang menarik')">💬 Tips Chat</div>
            <div class="suggestion-chip" onclick="quickReply('Cara move on dari mantan')">💔 Move On</div>
            <div class="suggestion-chip" onclick="quickReply('Cara meningkatkan percaya diri')">✨ Percaya Diri</div>
        </div>
        <div class="input-container">
            <input type="text" id="userInput" placeholder="Ketik pesanmu disini..." />
            <button class="clear-btn" onclick="clearChat()" title="Clear chat">🗑️</button>
            <button id="sendBtn" onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Modal</div>
                <button class="modal-close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Content will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        // Responses object
        const responses = {
            "cara pdkt": [
                "PDKT yang baik dimulai dari kenal dulu! Cari tahu hobinya, lalu ajak ngobrol tentang hal yang dia suka. Natural aja, jangan maksa! 😊",
                "Kunci PDKT: jadi pendengar yang baik, tunjukkan ketertarikan pada kehidupannya, dan jangan terlalu agresif. Slow but sure! 💪",
                "PDKT sukses = konsisten + perhatian kecil + respect boundaries. Jangan lupa, be yourself!"
            ],
            "ditolak": [
                "Ditolak itu bukan akhir dunia! Ini artinya dia bukan yang terbaik untuk kamu. Yang terbaik masih menunggu di depan! 💪",
                "Move on adalah pilihan terbaik. Fokus pada diri sendiri, upgrade skill, dan jadi versi terbaik dari dirimu. Dia akan menyesal! 😎",
                "Rejection is protection! Percaya aja, Tuhan sedang menyiapkan yang lebih baik untuk kamu."
            ],
            "chatting": [
                "Tips chatting: jangan cuma jawab 'iya', 'oke', atau 'haha'. Ajukan pertanyaan balik, tunjukkan ketertarikan! 📱",
                "Chat yang menarik = 70% nanya tentang dia, 30% cerita tentang kamu. Balance is key!",
                "Jangan spam chat! Kasih ruang untuk dia reply. Kalo udah dibales, baru lanjut ngobrol."
            ],
            "kenalan": [
                "Kenalan bisa dari hobi atau komunitas yang sama. Join club, ikut volunteer, atau event sosial. Kesempatan ada di mana-mana! 🌟",
                "Coba dating app! Tapi tetap hati-hati, kenalan online bisa jadi awal yang baik asal niat baik.",
                "Pergi ke tempat yang kamu suka (kafe, gym, perpustakaan). Lebih natural bertemu orang dengan interest yang sama!"
            ],
            "cara move on": [
                "Move on tips: unfollow/mute di sosmed, fokus hobi baru, dan spend time sama temen-temen. Time heals! ⏰",
                "Boleh sedih, tapi jangan berlarut-larut. Kasih waktu 1-2 minggu untuk healing, lalu bangkit lagi!",
                "Delete chat, foto, dan kenangan. Bukan berarti kamu lemah, tapi kamu sayang sama kesehatan mental kamu. 💚"
            ],
            "percaya diri": [
                "Percaya diri dimulai dari self-love! Olahraga, jaga penampilan, dan upgrade skill. Kamu akan naturally lebih pede! 💪",
                "Fake it till you make it! Pose power stance 2 menit sebelum ngobrol, auto boost confidence.",
                "Inget, semua orang punya insecure. Yang penting, jangan biarkan itu menghalangi kamu untuk mencoba!"
            ],
            "pacaran": [
                "Pacaran yang sehat = komunikasi terbuka + saling respect + support tujuan masing-masing. 💕",
                "Jangan kehilangan jati diri saat pacaran. Keep your friends, hobi, dan goals. Balance is important!",
                "Red flags: posesif berlebihan, suka ngatur, toxic behavior. Jangan ragu untuk keluar dari hubungan yang gak sehat!"
            ],
            "greetings": [
                "kwkwkwkwk💕",
                "kenapa kamu tanya begitu? Lagi butuh teman curhat ya? 😊",
                "Ada apaasiiiiihhh? Lagi pengen curhat atau tanya-tanya soal jomblo nih? 😊"
            ],
            "default": [
                "Hmm, interesting! Cerita lebih detail dong, biar aku bisa bantu lebih baik! 😊",
                "Aku disini untuk dengerin kamu. Mau curhat lebih lanjut?",
                "Tell me more! Aku siap kasih saran terbaik untuk kamu! 💡",
                "Kamu gak sendirian kok! Yuk cerita, pasti ada solusinya!",
                "awokawokawok",
                "kenapa dah gajelas banget sih pertanyaannya",
                "wah, pertanyaan sulit nih, coba tanya yang lain aja deh",
                "hmmm, aku kurang paham maksudmu, coba jelasin lagi dong"
            ]
        };

        // LocalStorage Management
        class ChatStorage {
            constructor() {
                this.storageKey = 'danielai_chats';
                this.profileKey = 'danielai_profile';
                this.statsKey = 'danielai_stats';
            }

            saveChat(messages) {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify(messages));
                } catch (e) {
                    console.error('Error saving chat:', e);
                }
            }

            loadChat() {
                try {
                    const data = localStorage.getItem(this.storageKey);
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    console.error('Error loading chat:', e);
                    return [];
                }
            }

            saveProfile(profile) {
                try {
                    localStorage.setItem(this.profileKey, JSON.stringify(profile));
                } catch (e) {
                    console.error('Error saving profile:', e);
                }
            }

            loadProfile() {
                try {
                    const data = localStorage.getItem(this.profileKey);
                    return data ? JSON.parse(data) : { name: 'Pengguna', avatar: '👤' };
                } catch (e) {
                    return { name: 'Pengguna', avatar: '👤' };
                }
            }

            saveStats(stats) {
                try {
                    localStorage.setItem(this.statsKey, JSON.stringify(stats));
                } catch (e) {
                    console.error('Error saving stats:', e);
                }
            }

            loadStats() {
                try {
                    const data = localStorage.getItem(this.statsKey);
                    if (data) {
                        return JSON.parse(data);
                    }
                    return { totalChats: 0, firstUse: new Date().toISOString() };
                } catch (e) {
                    return { totalChats: 0, firstUse: new Date().toISOString() };
                }
            }

            clearAll() {
                localStorage.removeItem(this.storageKey);
                localStorage.removeItem(this.profileKey);
                localStorage.removeItem(this.statsKey);
            }
        }

        const storage = new ChatStorage();
        let chatHistory = [];

        // Initialize
        function init() {
            loadProfile();
            loadStats();
            loadChatHistory();
            
            if (chatHistory.length === 0) {
                addWelcomeMessage();
            }
        }

        function loadProfile() {
            const profile = storage.loadProfile();
            document.getElementById('profileName').textContent = profile.name;
        }

        function loadStats() {
            const stats = storage.loadStats();
            document.getElementById('totalChats').textContent = stats.totalChats;
            
            const firstUse = new Date(stats.firstUse);
            const now = new Date();
            const daysDiff = Math.floor((now - firstUse) / (1000 * 60 * 60 * 24));
            document.getElementById('totalDays').textContent = daysDiff;
        }

        function updateStats() {
            const stats = storage.loadStats();
            stats.totalChats = (stats.totalChats || 0) + 1;
            storage.saveStats(stats);
            loadStats();
        }

        function loadChatHistory() {
            chatHistory = storage.loadChat();
            const chatContainer = document.getElementById('chatContainer');
            
            // Clear existing messages except typing indicator
            const typingIndicator = document.getElementById('typingIndicator');
            chatContainer.innerHTML = '';
            chatContainer.appendChild(typingIndicator);
            
            // Render all messages
            chatHistory.forEach(msg => {
                renderMessage(msg.content, msg.isUser, msg.timestamp, false);
            });
        }

        function addWelcomeMessage() {
            const welcomeMsg = {
                content: 'Halo! Aku DanielAI, siap membantu kamu keluar dari zona jomblo! 😊 Ada yang ingin kamu tanyakan atau ceritakan?',
                isUser: false,
                timestamp: getTime()
            };
            chatHistory.push(welcomeMsg);
            renderMessage(welcomeMsg.content, welcomeMsg.isUser, welcomeMsg.timestamp);
            storage.saveChat(chatHistory);
        }

        function getTime() {
            const now = new Date();
            return now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }

        function getResponse(message) {
            const lowerMessage = message.toLowerCase();

            if (lowerMessage.includes("pdkt") || lowerMessage.includes("deketin") || lowerMessage.includes("dekati")) {
                return responses["cara pdkt"][Math.floor(Math.random() * responses["cara pdkt"].length)];
            } else if (lowerMessage.includes("tolak") || lowerMessage.includes("ditolak") || lowerMessage.includes("reject")) {
                return responses["ditolak"][Math.floor(Math.random() * responses["ditolak"].length)];
            } else if (lowerMessage.includes("hai") || lowerMessage.includes("hmmm") || lowerMessage.includes("woi")) {
                return responses["greetings"][Math.floor(Math.random() * responses["greetings"].length)];
            } else if (lowerMessage.includes("chat") || lowerMessage.includes("wa") || lowerMessage.includes("whatsapp")) {
                return responses["chatting"][Math.floor(Math.random() * responses["chatting"].length)];
            } else if (lowerMessage.includes("kenalan") || lowerMessage.includes("kenal") || lowerMessage.includes("cari pacar")) {
                return responses["kenalan"][Math.floor(Math.random() * responses["kenalan"].length)];
            } else if (lowerMessage.includes("move on") || lowerMessage.includes("lupa") || lowerMessage.includes("mantan")) {
                return responses["cara move on"][Math.floor(Math.random() * responses["cara move on"].length)];
            } else if (lowerMessage.includes("pede") || lowerMessage.includes("percaya diri") || lowerMessage.includes("confidence")) {
                return responses["percaya diri"][Math.floor(Math.random() * responses["percaya diri"].length)];
            } else if (lowerMessage.includes("pacar") || lowerMessage.includes("pacaran") || lowerMessage.includes("relationship")) {
                return responses["pacaran"][Math.floor(Math.random() * responses["pacaran"].length)];
            } else if (lowerMessage.includes("pencipta")) {
                return "Yaaa ZAKI Lahhhhhhhhhh";
            } else if (lowerMessage.includes("kamu lagi apa")) {
                return "Lagi Mikirin kamu siiihhh";
            } else if (lowerMessage.includes("siapa kamu")) {
                return "Saya bot nya zaki yang diciptakan untuk membantu kamu keluar dari zona jomblo!";
            } else {
                return responses["default"][Math.floor(Math.random() * responses["default"].length)];
            }
        }

        function renderMessage(content, isUser, timestamp, shouldSave = true) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;

            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            messageContent.innerHTML = content + `<span class="timestamp">${timestamp}</span>`;

            messageDiv.appendChild(messageContent);
            chatContainer.insertBefore(messageDiv, document.getElementById('typingIndicator'));
            chatContainer.scrollTop = chatContainer.scrollHeight;

            if (shouldSave) {
                chatHistory.push({ content, isUser, timestamp });
                storage.saveChat(chatHistory);
            }
        }

        function showTyping() {
            document.getElementById('typingIndicator').style.display = 'block';
            document.getElementById('chatContainer').scrollTop = document.getElementById('chatContainer').scrollHeight;
        }

        function hideTyping() {
            document.getElementById('typingIndicator').style.display = 'none';
        }

        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();

            if (message === '') return;

            const timestamp = getTime();
            renderMessage(message, true, timestamp);
            input.value = '';

            updateStats();

            showTyping();

            setTimeout(() => {
                hideTyping();
                const response = getResponse(message);
                const botTimestamp = getTime();
                renderMessage(response, false, botTimestamp);
            }, 1000 + Math.random() * 1000);
        }

        function quickReply(message) {
            document.getElementById('userInput').value = message;
            sendMessage();
        }

        function clearChat() {
            if (confirm('Apakah Anda yakin ingin menghapus chat saat ini?')) {
                chatHistory = [];
                storage.saveChat(chatHistory);
                
                const chatContainer = document.getElementById('chatContainer');
                chatContainer.innerHTML = `
                    <div class="typing-indicator" id="typingIndicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                `;
                
                addWelcomeMessage();
            }
        }

        function toggleProfileMenu() {
            const menu = document.getElementById('profileMenu');
            menu.classList.toggle('active');
        }

        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const menu = document.getElementById('profileMenu');
            const logo = document.querySelector('.logo');
            
            if (!menu.contains(event.target) && !logo.contains(event.target)) {
                menu.classList.remove('active');
            }
        });

        // Modal functions
        function showModal(title, content) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function showEditProfile() {
            toggleProfileMenu();
            const profile = storage.loadProfile();
            const content = `
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; color: rgba(255, 255, 255, 0.8);">Nama:</label>
                    <input type="text" id="profileNameInput" value="${profile.name}" 
                           style="width: 100%; padding: 12px; background: rgba(30, 41, 59, 0.5); 
                                  border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; 
                                  color: white; font-size: 1em;">
                </div>
                <button onclick="saveProfile()" 
                        style="width: 100%; padding: 12px; background: linear-gradient(135deg, #6366f1, #a855f7); 
                               border: none; border-radius: 8px; color: white; font-size: 1em; 
                               font-weight: 600; cursor: pointer;">
                    Simpan
                </button>
            `;
            showModal('Edit Profil', content);
        }

        function saveProfile() {
            const name = document.getElementById('profileNameInput').value.trim();
            if (name) {
                storage.saveProfile({ name, avatar: '👤' });
                loadProfile();
                closeModal();
                alert('Profil berhasil diperbarui!');
            }
        }

        function showHistory() {
            toggleProfileMenu();
            if (chatHistory.length === 0) {
                showModal('Riwayat Chat', '<p>Belum ada riwayat chat.</p>');
                return;
            }

            let content = '<div>';
            const groupedChats = {};
            
            chatHistory.forEach((msg, index) => {
                const date = new Date().toLocaleDateString('id-ID');
                if (!groupedChats[date]) {
                    groupedChats[date] = [];
                }
                groupedChats[date].push({ ...msg, index });
            });

            for (const [date, messages] of Object.entries(groupedChats)) {
                content += `
                    <div class="history-item">
                        <div class="history-date">${date}</div>
                        <div class="history-preview">${messages.length} pesan</div>
                    </div>
                `;
            }
            
            content += '</div>';
            showModal('Riwayat Chat', content);
        }

        function showSettings() {
            toggleProfileMenu();
            const content = `
                <div style="color: rgba(255, 255, 255, 0.8); line-height: 1.8;">
                    <h3 style="color: white; margin-bottom: 15px;">Pengaturan</h3>
                    <p><strong>✅ Auto-save:</strong> Chat otomatis tersimpan</p>
                    <p><strong>🔔 Notifikasi:</strong> Aktif</p>
                    <p><strong>🎨 Tema:</strong> Dark Mode</p>
                    <p><strong>💾 Penyimpanan:</strong> ${((JSON.stringify(chatHistory).length / 1024).toFixed(2))} KB</p>
                    <br>
                    <p style="font-size: 0.9em; opacity: 0.6;">Fitur pengaturan lengkap akan segera hadir!</p>
                </div>
            `;
            showModal('Pengaturan', content);
        }

        function exportChat() {
            toggleProfileMenu();
            
            if (chatHistory.length === 0) {
                alert('Tidak ada chat untuk di-export!');
                return;
            }

            let text = '=== DanielAI Chat Export ===\n';
            text += `Tanggal: ${new Date().toLocaleString('id-ID')}\n\n`;
            
            chatHistory.forEach(msg => {
                const sender = msg.isUser ? 'Kamu' : 'DanielAI';
                text += `[${msg.timestamp}] ${sender}: ${msg.content}\n\n`;
            });

            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `DanielAI_Chat_${new Date().getTime()}.txt`;
            a.click();
            URL.revokeObjectURL(url);

            alert('Chat berhasil di-export!');
        }

        function showAbout() {
            toggleProfileMenu();
            const content = `
                <div style="text-align: center; color: rgba(255, 255, 255, 0.8);">
                    <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #6366f1, #a855f7); 
                                border-radius: 50%; display: flex; align-items: center; justify-content: center; 
                                font-size: 40px; margin: 0 auto 20px; box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);">
                        💬
                    </div>
                    <h2 style="color: white; margin-bottom: 10px;">DanielAI v2.0</h2>
                    <p style="margin-bottom: 20px; opacity: 0.6;">Konsultan Pribadi untuk Para Jomblo</p>
                    <p style="line-height: 1.8; text-align: left;">
                        DanielAI adalah chatbot AI yang dirancang khusus untuk membantu kamu dalam berbagai aspek kehidupan percintaan, mulai dari PDKT, tips chat, move on, hingga meningkatkan kepercayaan diri.
                    </p>
                    <br>
                    <p style="font-size: 0.9em; opacity: 0.6;">
                        Created with ❤️ by ZAKI<br>
                        © 2025 DanielAI. All rights reserved.
                    </p>
                </div>
            `;
            showModal('Tentang DanielAI', content);
        }

        function showHelp() {
            toggleProfileMenu();
            const content = `
                <div style="color: rgba(255, 255, 255, 0.8); line-height: 1.8;">
                    <h3 style="color: white; margin-bottom: 15px;">📖 Panduan Penggunaan</h3>
                    
                    <p><strong>💬 Cara Menggunakan:</strong></p>
                    <ul style="margin-left: 20px; margin-bottom: 15px;">
                        <li>Ketik pertanyaan atau curhat kamu di kolom input</li>
                        <li>Tekan Enter atau klik tombol Kirim</li>
                        <li>Gunakan suggestion chips untuk pertanyaan cepat</li>
                    </ul>

                    <p><strong>🎯 Topik yang Bisa Ditanyakan:</strong></p>
                    <ul style="margin-left: 20px; margin-bottom: 15px;">
                        <li>Cara PDKT yang baik</li>
                        <li>Tips chatting menarik</li>
                        <li>Cara move on dari mantan</li>
                        <li>Meningkatkan percaya diri</li>
                        <li>Tips pacaran sehat</li>
                        <li>Dan banyak lagi!</li>
                    </ul>

                    <p><strong>💾 Fitur:</strong></p>
                    <ul style="margin-left: 20px;">
                        <li>Chat tersimpan otomatis (localStorage)</li>
                        <li>Export chat ke file txt</li>
                        <li>Statistik penggunaan</li>
                        <li>Profile customization</li>
                    </ul>
                </div>
            `;
            showModal('Bantuan', content);
        }

        function clearAllData() {
            toggleProfileMenu();
            
            if (confirm('⚠️ PERINGATAN!\n\nIni akan menghapus SEMUA data termasuk:\n• Semua riwayat chat\n• Profil pengguna\n• Statistik\n\nApakah Anda yakin?')) {
                if (confirm('Apakah Anda BENAR-BENAR yakin? Tindakan ini tidak dapat dibatalkan!')) {
                    storage.clearAll();
                    chatHistory = [];
                    
                    const chatContainer = document.getElementById('chatContainer');
                    chatContainer.innerHTML = `
                        <div class="typing-indicator" id="typingIndicator">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    `;
                    
                    // Reset profile
                    storage.saveProfile({ name: 'Pengguna', avatar: '👤' });
                    storage.saveStats({ totalChats: 0, firstUse: new Date().toISOString() });
                    
                    loadProfile();
                    loadStats();
                    addWelcomeMessage();
                    
                    alert('✅ Semua data berhasil dihapus!');
                }
            }
        }

        function toggleTheme() {
            alert('Fitur tema akan segera hadir! 🌙✨');
        }

        // Event listeners
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Close modal when clicking outside
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Initialize on load
        window.addEventListener('load', init);
    </script>
</body>

</html>
